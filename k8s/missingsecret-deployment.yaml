# This deployment will fetch the config from the configfile it is referencing.

# Apply:  kubectl apply -f k8s/missingsecret-deployment.yaml
# Run This to see the error : kubectl get pods -w
# Remove: kubectl delete -f k8s/missingsecret-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-secret-deployment
  labels:
    app: mongodb-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-secret
  template:
    metadata:
      labels:
        app: mongodb-secret
    spec:
      containers:
      - name: mongodb-secret
        image: mongo:latest
        ports:
        - containerPort: 27170
        env:
        - name: DB-PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
